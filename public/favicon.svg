<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b3d91" />
      <stop offset="70%" stop-color="#051532" />
      <stop offset="100%" stop-color="#020814" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#00b4d8" stroke-width="2.5" />

  <!-- Stars -->
  <circle cx="16" cy="18" r="0.9" fill="#ffffff" opacity="0.9" />
  <circle cx="48" cy="20" r="0.8" fill="#38bdf8" opacity="0.8" />
  <circle cx="20" cy="46" r="0.7" fill="#ffffff" opacity="0.7" />
  <circle cx="46" cy="46" r="0.9" fill="#34d399" opacity="0.8" />

  <!-- Orbit Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" transform="rotate(-28 32 32)" opacity="0.85" />
  
  <!-- Red NASA Vector Chevron -->
  <path d="M 12 44 Q 30 14 52 24 Q 38 34 16 46" fill="none" stroke="#e03c31" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

  <!-- Central Sprout / Earth Life Emblem (Seedling) -->
  <g filter="url(#glow)">
    <!-- Stem -->
    <path d="M 32 46 Q 32 34 32 26" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M 32 32 C 22 30 18 20 28 18 C 32 22 32 28 32 32 Z" fill="#34d399" />
    <!-- Right Leaf -->
    <path d="M 32 27 C 42 25 46 16 36 14 C 32 18 32 24 32 27 Z" fill="#10b981" />
  </g>
</svg>
